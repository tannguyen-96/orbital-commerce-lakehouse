models:
  - name: products_t
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique:
              config:
                where: "price > 0"
        description: "The unique identifier for the product."
  - name: orders_t
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
        description: "The unique identifier for the order."
